<!DOCTYPE html>

<html>

<head> 

<title> Fretastic Landing Page </title>

<style>

body {
  margin: 0;

.head {

  border-top: 2px solid yellow;     
  border-bottom: 2px solid #001739;
  display: flex;
  align-items: center;

}

.head h1 {

.logo {

.navBtn:hover {
  background-color: #1e3686;
  border-color: #1e3686;

.footer {

  margin-top: 441px;
  padding: 15px;
  background-color: #ffffff;
  border-top: 2px solid #001739; 
  border-bottom: 2px solid yellow;

  color: #555555;
  text-decoration: none;

<div class="box">
  <div class="boxContent">
    <p class="boxText">

    <div class="boxNav">
