<!DOCTYPE html>
<html>
<head> 
    <title>Fretastic Landing Page</title>
<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #555555, #000000);
}

.head {
    padding: 15px 20px;                  
    background-color: #222222;
    display: flex;
    align-items: center;
    gap: 40px; 
}

.head h1 {
    color: white; 
    margin: 0;
    font-size: 28px;
}

.logo {
    height: 50px;      
    width: auto;       
}

.box {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
}

.boxContent {
    background-color: #333333;
    border: 2px solid #222222; 
    padding: 45px; 
    border-radius: 12px;
}

.boxText {
    font-size: 18px;
    color: #ffffff;
}

.boxNav {
    display: flex;
    justify-content: center;
    margin-top: 50px;
    gap: 50px;
}

.navBtn {
    padding: 10px 30px;
    text-decoration: none;
    color: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 8px;
    background-color: transparent;
}

.navBtn:hover {
    background-color: #ffffff;
    color: #000000; 
}

.footer {
    text-align: center;
    padding: 15px;
    background-color: #222222;
}

.footer a {
    color: white; 
    text-decoration: none;
    font-size: 12px;
}
</style>
</head>
<body>

<header class="head">
  <img src="images/fretastic.png" class="logo">
  <h1>NEED A FANTASTIC GUITAR? WE GOT YOU!</h1>
</header>

<div class="box">
  <div class="boxContent">
    <p class="boxText">
        You already have an account here on <strong>Fretastic?</strong></p>
    
    <div class="boxNav">
        <a href="fretasticLogIn.html" class="navBtn"><strong>YES</strong></a>
        <a href="fretasticSignUp.html" class="navBtn"><strong>NO</strong></a>
    </div>
  </div>
</div>

<footer class="footer">
  <a href="">Contact Us</a>
</footer>

</body>
</html>
