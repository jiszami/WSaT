<!DOCTYPE html>
<html>
<head> 
    <title>Fretastic Log In</title>
<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #555555);
}

.head {
    padding: 10px 20px;                  
    background-color: #222222; 
    display: flex;
    align-items: center;
    gap: 40px; 
}

.logo {
    height: 50px;      
    width: auto;       
}

.box {
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;
    flex: 1;
}

.box h3 {
    font-size: 24px;
    color: white; 
    margin-top: 0;
    margin-bottom: 15px; 
    width: 364px;
    text-align: left;
}

.boxContent {
    background-color: #333333; 
    border: 2px solid #222222;    
    flex-direction: column;
    padding: 40px; 
    display: flex;
    width: 280px;
    border-radius: 12px;
}

.boxContent label {
    margin-bottom: 5px;
    color: white; 
}

.boxContent input {
    padding: 8px;
    margin-bottom: 20px;
    border: 2px solid #ffffff; 
    border-radius: 6px;
    background-color: #ffffff; 
    font-size: 14px;
}

.boxBtn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background-color: transparent; 
    color: white;
    font-weight: bold;
    font-size: 14px;
    border: 2px solid white;
    border-radius: 8px;
}

.boxBtn:hover {
    background-color: #ffffff;
    color: #000000; 
}

.footer {
    text-align: center;
    padding: 15px;
    background-color: #222222;
}

.footer a {
    color: white; 
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
}

.footer a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<header class="head">
  <img src="images/fretastic.png" class="logo">
</header>

<div class="box">
  <h3>Please Log In first...</h3>
  
  <div class="boxContent">
    <label><strong>Name:</strong></label>
    <input type="text">
    
    <label><strong>Email:</strong></label>
    <input type="text">
    
    <label><strong>Password:</strong></label>
    <input type="password">
    
    <a href="fretHome.html" style="text-decoration: none; width: 100%;">
      <button class="boxBtn">LOG IN</button>
    </a>
  </div>
</div>

<footer class="footer">
  <a href="">Contact Us</a>
</footer>

</body>
</html>
