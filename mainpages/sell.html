<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretastic Seller Account</title>

    <link rel="stylesheet" href="../css/Sell.css">

</head>
<body>

    <header class="head">
        <img src="../images/fretastic.png" alt="Fretastic Logo" class="logo">
        <h1>Welcome to Fretastic! Find your sound.</h1>
    </header>

    <main class="box">
        <h3>Seller Account</h3>

        <div class="content">
            <label for="company"><strong>Brand or Company Name:</strong></label>
            <input type="text" id="company" name="company" placeholder="Enter brand or company name">

            <label for="email"><strong>Email Address:</strong></label>
            <input type="email" id="email" name="email" placeholder="Enter email address">

            <label for="contact"><strong>Contact Number:</strong></label>
            <input type="tel" id="contact" name="contact" placeholder="Enter contact number">

            <label for="password"><strong>Password:</strong></label>
            <input type="password" id="password" name="password" placeholder="Enter password">

            <a href="seller.html" class="btn">SIGN IN</a>
            <a href="seller.html" class="btn">CREATE ACCOUNT</a>
        </div>
    </main>

    <footer class="footer">
        <a href="mailto:202580087@psu.edu.ph">Contact Us</a>
    </footer>

</body>
</html>
