<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretastic: Seller Account</title>

    <link rel="stylesheet" href="../css/Sell.css">

</head>
<body>

    <header class="head">
    <img src="../images/Fretasticcc.png" class="logo" alt="Fretastic Logo">
    <h1>Find your sound.</h1>
</header>

    <main class="box">
        <section class="content">
            <h2>Welcome to Fretastic</h2>
            <p>Let other people discover your products.</p>

            <form>
                <input type="text" name="username" placeholder="Brand or Company Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <a href="seller.html" class="btn">SIGN IN</a>
                <a href="seller.html" class="btn">REGISTER BRAND</a>
            </form>
        </section>
    </main>

    <footer class="footer">
        <a href="mailto:202580087@psu.edu.ph">Contact Us</a>
    </footer>

</body>
</html>
