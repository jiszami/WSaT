<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sautéia</title>
<style>

/* fitting the page */
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden; 
}

.body {
  background-color: #ffffff; 
  color: #333333; 
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Header Container */
.head {
  display: flex;
  align-items: center;
  padding: 12px 50px; 
  background-color: #ffffff;
  border-bottom: 2px solid #001739; 
  border-top: 2px solid yellow;
  position: relative; 
  flex-shrink: 0; 
}

.textHeader {
  display: flex;
  align-items: center;
  gap: 40px; 
}

.logo {
  height: 45px;       
  width: auto;        
  object-fit: contain;
}

.textHeader h1 {
  color: black;
  margin: 0;
  font-size: 28px;
}
/* Center Box */
.box {
  display: flex;
  justify-content: center;
  padding-top: 150px;
  background-color: #fcfcfc;
}

.boxContent {
  width: 500px;
  height: 300px;
  background-color: #ffffff; 
  border: 2px solid black;    
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 45px; 
  box-sizing: border-box;
}

.boxText {
  font-size: 18px;
  line-height: 1.5;
  text-align: center;
  color: #333333;
  margin: 0;
  margin-top: 5px; 
}

.shadow {
  font-weight: bold;
  color: #333333; 
  text-shadow: 0 4px 20px rgba(30, 54, 134, 0.6);
}

.boxNav {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 5px; 
}

.navBtn {
  flex: 1;
  max-width: 140px;
  padding: 10px 0;
  text-align: center;
  font-weight: bold;
  text-decoration: none;
  color: #001739;
  border: 2px solid #001739;
  border-radius: 6px;
}

.navBtn:hover {
  background-color: #1e3686;
  border-color: #1e3686;
  color: #ffffff;
}

.footer {
  text-align: center;
  padding: 20px;
  background-color: #ffffff;
  border-top: 2px solid #001739; 
  border-bottom: 2px solid yellow;
  margin-top: auto; 
}

.footer a {
  color: #555555;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}

.footer a:hover {
  color: #3758c7;
  text-decoration: underline;
}

</style>
</head>
<body class="body">

<header class="head">
  <div class="textHeader">
      <img src="sauteia.png" class="logo">
      <h1>WELCOME TO SAUTÉIA!</h1>
  </div>
</header>

<div class="box">
  <div class="boxContent">
    <p class="boxText">
        Please choose: <br><br>
        <span class="shadow">"Log In"</span> if you have an existing account. <br>
        <span class="shadow">"Sign Up"</span> if you are new in sautéia.
    </p>
    
    <div class="boxNav">
        <a href="login.html" class="navBtn">Log In</a>
        <a href="signup.html" class="navBtn">Sign Up</a>
    </div>
  </div>
</div>

<footer class="footer">
  <a href="about.html">About Us</a>
</footer>

</body>
</html>
