<!DOCTYPE html>

<style>

html, body {

}

.body {

  color: #333333; 
  font-family: Arial, sans-serif;
  display: flex;

.head {
  display: flex;

  position: relative; 
  flex-shrink: 0; 
}

.logo {

}

.box {
    position: absolute;
    top: 38%;
    left: 50%;

    flex-direction: column;
    align-items: center; 
}

.box h3{
    font-size: 18px;

    color: #333333;

}

.boxContent {
    width: 500px;           
    background-color: #ffffff;  
    border: 2px solid #000000;  
    border-radius: 8px;         
    padding: 30px;
    box-sizing: border-box;
}

.box label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}
.box input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #000000;
    border-radius: 4px;
    box-sizing: border-box;
}

main {
 text-decoration: none; 
 width: 100%; 
 display: block;
}

.boxBtn {
    width: 100%;
    padding: 10px;
    background-color: black;
    color: white;
    margin-top: 25px;
    font-weight: bold;
    cursor: pointer;
}

.boxBtn:hover {
  background-color: #1e3686;
  border-color: #1e3686;
  color: #ffffff;
}

.footer {
  text-align: center;
  padding: 20px;
  background-color: #ffffff;
  border-top: 2px solid #001739; 
  border-bottom: 2px solid yellow;
  margin-top: auto; 
}

.footer a {
  color: #555555;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}

.footer a:hover {
  color: #3758c7;
  text-decoration: underline;
}

</style>

</head>
