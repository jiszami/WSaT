<!DOCTYPE html>

<html>

<head>

<title> Top 3 Best Dishes in the Philippines</title>

<style>

html, body {
  height: 100%;
}

.body {
  background-color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 50px;
  background-color: #ffffff;
  border-bottom: 1px solid #eeeeee;
}

.logo {
  display: flex;
  align-items: center;
  gap: 20px; 
}

.logo-img {
  height: 50px;        
  width: auto;        
  object-fit: contain;
}

.nav {
  display: flex;
  gap: 20px;
}

.nav a {
  display: block;
  color: black;
  text-align: center;
  padding: 12px 24px;
  text-decoration: none;
  border: 1px solid black;
  border-radius: 4px;
  font-weight: bold;
}

.nav a:hover {
  background-color: black;
  color: white;
}



.center-wrapper {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center; 
}


.register-text {
    font-size: 18px;      
    font-weight: normal;   
    color: #333333;       
    margin-bottom: 15px;   
    text-align: center;
}


.box {
    width: 500px;
    height: auto;               
    background-color: #ffffff;  
    border: 2px solid #000000;  
    border-radius: 8px;         
    padding: 30px;
    box-sizing: border-box;
}
.box label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}
.box input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #000000;
    border-radius: 4px;
    box-sizing: border-box;
}
.box-btn {
    width: 100%;
    padding: 10px;
    background-color: black;
    color: white;
    border: none;
    border-radius: 4px;
    margin-top: 25px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
}

.footer {
  text-align: center;
  padding: 20px;
  background-color: #ffffff;
  border-top: 1px solid #eeeeee;
  margin-top: auto; 
}

.footer a {
  color: #555555;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.footer a:hover {
  color: black;
  text-decoration: underline;
}

</style>

</head>

<body class="body">

<header class="top">
    
    <div class="logo"> 
      
      <img src="sauteia.png" class="logo-img" alt="Sauteia Logo">
    
  </div>

    <div class="nav">
      <a href="signup.html">Sign Up</a>
      <a href="login.html">Log In</a>
    </div>
</header>


<div class="center-wrapper">
    
    <h3 class="register-text">Hello, please create an account...</h3>

    <div class="box">
        <label>Name:</label>
        <input type="text">
        
        <label>Register E-mail:</label>
        <input type="text">
        
        <label>Create a Password:</label>
        <input type="password">
        
        <button class="box-btn">SIGN UP</button>
    </div>

</div>

<footer class="footer">

  <a href="about.html">About Us</a>

</footer>

</body>

</html>
